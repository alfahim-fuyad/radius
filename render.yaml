services:
  - type: web
    name: radius
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_URL
        sync: false

      # Aiven MySQL
      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "19710"

      - key: DB_NAME
        value: defaultdb

      - key: DB_USER
        value: avnadmin

      - key: DB_PASSWORD
        sync: false

      - key: DB_SSL_MODE
        value: REQUIRED

      - key: DB_SSL_CA_PEM
        sync: false

      # FastAPI
      - key: AI_SERVICE_URL
        sync: false

      # ResNet50 can exceed the memory limit when PHP and FastAPI share one
      # instance. pHash-based image analysis remains available.
      - key: ENABLE_IMAGE_EMBEDDINGS
        value: "false"

      # pandas + scikit-learn (RandomForest price fallback, TF-IDF/Naive
      # Bayes fraud text model) are also opt-in. Importing them alone costs
      # 100+ MB of RAM at process start even before any model is trained.
      # Keep disabled on the free 512 MB instance; live SerpApi price
      # search and rule-based/heuristic fraud signals remain available.
      - key: ENABLE_ML_FALLBACK
        value: "false"

      # SerpApi
      - key: SERPAPI_KEY
        sync: false

      - key: MAX_UPLOAD_MB
        value: "5"

      - key: DEFAULT_RADIUS_KM
        value: "5"